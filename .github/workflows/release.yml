# Release of GarnetOps (ADR 0007): runs when a tag v* is pushed.
#
#   build    (per architecture, native runners): build the app, web and update sidecar
#            images (the sidecar from updater/, ADR 0026), push them by digest without a
#            tag, smoke-test the digests with the production Compose file, including the
#            upgrade from the previous release through the sidecar just built
#   release  (after every build and smoke passed): tag and sign the multi-arch images
#            (keyless, this workflow's identity), attach SBOMs, write and sign release.json,
#            publish the GitHub release
#
# Nothing is tagged and no release is public before the smoke tests passed. The sidecar
# on every installation trusts exactly this file at the release tag (updater.yaml:
# trust.keyless.github), so keep its name. The build, smoke, publish and release-json
# actions are the ones in updater/actions (updater/VENDORED.md), not external code.

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_REPOSITORY: ghcr.io/lcsfls/garnetops
  WEB_REPOSITORY: ghcr.io/lcsfls/garnetops-web
  UPDATER_REPOSITORY: ghcr.io/lcsfls/garnetops-updater

jobs:
  build:
    name: Build and smoke ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the app image (API and worker)
        id: app
        uses: ./updater/actions/build
        with:
          image: ${{ env.APP_REPOSITORY }}
          target: app
          platforms: ${{ matrix.platform }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the web image (edge)
        id: web
        uses: ./updater/actions/build
        with:
          image: ${{ env.WEB_REPOSITORY }}
          target: web
          platforms: ${{ matrix.platform }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the update sidecar image
        id: updater
        uses: ./updater/actions/build
        with:
          image: ${{ env.UPDATER_REPOSITORY }}
          context: updater
          file: updater/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            REVISION=${{ github.sha }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test, with the upgrade from the previous release through the sidecar
        uses: ./updater/actions/smoke
        with:
          compose-files: docker-compose.yml,docker-compose.smoke.yml
          images: >-
            {"app": {"repository": "${{ env.APP_REPOSITORY }}", "digest": "${{ steps.app.outputs.digest }}"},
             "web": {"repository": "${{ env.WEB_REPOSITORY }}", "digest": "${{ steps.web.outputs.digest }}"}}
          image-vars: '{"app": "APP_IMAGE", "web": "WEB_IMAGE"}'
          # The version is only told to the sidecar's token, so the runner checks readiness only.
          health-url: http://127.0.0.1:3000/api/healthz
          upgrade-from: previous
          updater-config: updater.yaml
          # The sidecar image built above, by digest: the upgrade test runs on the sidecar that ships.
          updater-image: ${{ env.UPDATER_REPOSITORY }}@${{ steps.updater.outputs.digest }}
          # Throwaway values for the variables the Compose file requires.
          env: |
            PUBLIC_URL=https://localhost:8443
            GARNETOPS_HOST=localhost
            HTTPS_PORT=8443
            HTTP_PORT=8080
            POSTGRES_PASSWORD=smoke-${{ github.run_id }}-${{ github.run_attempt }}
            BETTER_AUTH_SECRET=smoke-secret-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef
            GARNETOPS_GRYPE_DB_UPDATE=off
            PROJECT_DIR=${{ github.workspace }}

      - name: Keep the digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s' "$APP_DIGEST" > "digests/app-$ARCH"
          printf '%s' "$WEB_DIGEST" > "digests/web-$ARCH"
          printf '%s' "$UPDATER_DIGEST" > "digests/updater-$ARCH"

      - name: Upload the digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      packages: write # tags, signatures and SBOM attestations
      id-token: write # keyless signing with this workflow's OIDC identity
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: The platform digests per image
        id: digests
        run: |
          printf 'images={"app": {"repository": "%s", "digests": ["%s", "%s"]}, "web": {"repository": "%s", "digests": ["%s", "%s"]}, "updater": {"repository": "%s", "digests": ["%s", "%s"]}}\n' \
            "$APP_REPOSITORY" "$(cat digests/app-amd64)" "$(cat digests/app-arm64)" \
            "$WEB_REPOSITORY" "$(cat digests/web-amd64)" "$(cat digests/web-arm64)" \
            "$UPDATER_REPOSITORY" "$(cat digests/updater-amd64)" "$(cat digests/updater-arm64)" >> "$GITHUB_OUTPUT"

      - name: Tag, sign and attach SBOMs
        id: publish
        uses: ./updater/actions/publish
        with:
          images: ${{ steps.digests.outputs.images }}
          signing: keyless
          registry: ghcr.io
          password: ${{ secrets.GITHUB_TOKEN }}

      # Title and text come from CHANGELOG.md, so the release is never edited by hand: a release
      # created or published by hand before this step blocks it.
      - name: Release title and text from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          title="$(node scripts/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md")"
          printf 'title=%s\n' "$title" >> "$GITHUB_OUTPUT"

      - name: release.json and the release
        uses: ./updater/actions/release-json
        with:
          release-name: ${{ steps.notes.outputs.title }}
          notes-file: ${{ runner.temp }}/release-notes.md
          images: ${{ steps.publish.outputs.images }}
          signing: keyless
          release-host: github
          policy-file: .cicd-updater/release-policy.yaml
          notes-url: https://github.com/lcsfls/garnet-ops/blob/${{ github.ref_name }}/CHANGELOG.md
