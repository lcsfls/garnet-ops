# Checks for every pull request and every push to main (AGENTS.md: CI green before merge).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history of the change

      - name: Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"

      # pnpm 12 needs a newer corepack than Node.js 24 ships.
      - name: pnpm
        run: npm install --global corepack@0.36.0 && corepack enable

      - name: Install
        run: corepack pnpm install --frozen-lockfile

      - name: Lint and format
        run: corepack pnpm lint

      - name: Types
        run: corepack pnpm typecheck

      - name: Unit tests
        run: corepack pnpm test

      - name: Web build
        run: corepack pnpm --filter @garnetops/web build

      - name: Secrets (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --no-banner --redact --log-opts="--all"
