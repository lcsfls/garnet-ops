# GarnetOps as a Docker Compose stack (ADR 0007).
#
#   web      Caddy: HTTPS, the web app, /api to the API, the maintenance page during updates
#   api      HTTP API; runs the database migrations on start
#   worker   clones repositories and stores scan results; holds the vault private key
#   scanner  runs syft and grype on the clones: no network, no vault key, no database (ADR 0028)
#   db       PostgreSQL 17
#   init     creates the vault key pair once, then exits
#   updater  the optional update sidecar (cicd-updater), OPT-IN:
#              docker compose --profile updater up -d
#
# Install: docs/installation.md. Update: docs/updating.md. Copy .env.example to .env and
# fill it in; APP_IMAGE and WEB_IMAGE are written by the updater after an update.

name: garnetops

x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE in .env}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777
  networks: [internal]

x-database-url: &database-url postgres://garnetops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/garnetops

services:
  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GARNETOPS_HOST: ${GARNETOPS_HOST:-localhost}
      GARNETOPS_TLS: ${GARNETOPS_TLS:-internal}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - web-data:/data # Caddy's certificates (and its internal CA)
      - web-config:/config
      - ${GARNETOPS_CERTS_DIR:-./certs}:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [internal, public]

  api:
    <<: *app
    command: ["node", "apps/api/src/index.ts"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      GARNETOPS_VAULT_PUBLIC_KEY_FILE: /vault/public/vault.pub.pem
      # Optional update sidecar; set UPDATER_URL= (empty) in .env to switch in-app updates off.
      UPDATER_URL: ${UPDATER_URL-http://updater:8090}
      UPDATER_TOKEN_FILE: /run/cicd-updater/token
    volumes:
      # The public half only: the API can seal secrets but never open them (ADR 0004).
      - type: volume
        source: vault
        target: /vault/public
        read_only: true
        volume: { subpath: public }
      - updater-shared:/run/cicd-updater:ro # the sidecar's token, read-only, the API only
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["node", "apps/worker/src/index.ts"]
    environment:
      DATABASE_URL: *database-url
      GARNETOPS_VAULT_PRIVATE_KEY_FILE: /vault/private/vault.key.pem
      # "auto": daily vulnerability database updates from Anchore; "off" for air-gapped hosts.
      GARNETOPS_GRYPE_DB_UPDATE: ${GARNETOPS_GRYPE_DB_UPDATE:-auto}
      GARNETOPS_SCAN_CONCURRENCY: ${GARNETOPS_SCAN_CONCURRENCY:-2}
      # Links in notifications point here (ADR 0010).
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      # syft and grype run in the scanner service (ADR 0028); the clones go to the volume it reads.
      GARNETOPS_SCANNER_SOCKET: /run/garnetops-scanner/scanner.sock
      GARNETOPS_SCANNER_WORK_DIR: /work
    tmpfs:
      # Deploy keys during a clone, git's home and the scan reports; deleted after each scan.
      - /tmp:size=${GARNETOPS_WORK_TMPFS:-4g},mode=1777
    volumes:
      - type: volume
        source: vault
        target: /vault/private
        read_only: true
        volume: { subpath: private }
      - vulndb:/var/lib/garnetops/vulndb
      # The clones, in memory and deleted after each scan (scanned content never touches a disk).
      - scan-work:/work
      - type: volume
        source: scanner-socket
        target: /run/garnetops-scanner
        read_only: true
    # Clones and the vulnerability database need outbound network; nothing listens.
    networks: [internal, egress]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      # Started, not healthy: an image older than 0.0.9 has no scanner service (see there).
      scanner:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "${GARNETOPS_WORKER_CPUS:-2}"
          memory: ${GARNETOPS_WORKER_MEMORY:-4g}

  # Reads hostile input (the scanned repositories), so it gets nothing else: no network at all,
  # no vault key, no database, the clones read-only and limits of its own (ADR 0028).
  scanner:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    # An image older than 0.0.9 has no scanner service: the container then idles and that
    # image's worker scans by itself, so this file also works before the images are updated.
    command:
      - sh
      - -c
      - >-
        if [ -f apps/worker/src/scanner.ts ]; then exec node apps/worker/src/scanner.ts; fi;
        echo "scanner: this image has no scanner service; its worker scans by itself";
        exec tail -f /dev/null
    environment:
      GARNETOPS_SCANNER_SOCKET: /run/garnetops-scanner/scanner.sock
      GARNETOPS_SCANNER_WORK_DIR: /work
      GARNETOPS_SCAN_CONCURRENCY: ${GARNETOPS_SCAN_CONCURRENCY:-2}
    tmpfs:
      # syft's and grype's scratch space and reports, per run.
      - /tmp:size=2g,mode=1777
    volumes:
      - type: volume
        source: scan-work
        target: /work
        read_only: true
      - type: volume
        source: vulndb
        target: /var/lib/garnetops/vulndb
        read_only: true
      - scanner-socket:/run/garnetops-scanner
    network_mode: none
    healthcheck:
      test: ["CMD", "node", "apps/worker/src/scanner.ts", "health"]
      interval: 15s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${GARNETOPS_SCANNER_CPUS:-2}"
          memory: ${GARNETOPS_SCANNER_MEMORY:-4g}
          pids: 512

  init:
    <<: *app
    restart: "no"
    command: ["node", "apps/worker/src/init-vault.ts", "/vault"]
    volumes:
      - vault:/vault

  db:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: garnetops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: garnetops
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garnetops -d garnetops"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  updater:
    profiles: ["updater"] # opt-in
    # The GarnetOps update sidecar, ghcr.io/lcsfls/garnetops-updater (ADR 0026, built from updater/).
    # Never one of the image variables the updater writes. Verify it with cosign and pin it
    # by digest (docs/updating.md).
    image: ${CICD_UPDATER_IMAGE:?set CICD_UPDATER_IMAGE in .env}
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      io.github.restow-backup.cicd-updater.role: sidecar
    environment:
      CICD_UPDATER_CONFIG: ${PROJECT_DIR:?set PROJECT_DIR in .env}/updater.yaml
      CICD_UPDATER_COMPOSE__PROJECT_DIR: ${PROJECT_DIR:?set PROJECT_DIR in .env}
    volumes:
      # The Docker socket makes the sidecar root-equivalent on this host (docs/updating.md).
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_DIR:?set PROJECT_DIR in .env}:${PROJECT_DIR:?set PROJECT_DIR in .env} # same path inside and outside
      - updater-state:/state
      - updater-shared:/shared
      - updater-verify:/verify
    networks: [internal, egress] # no published ports
    security_opt: ["no-new-privileges:true"]

volumes:
  db-data:
  vault:
  vulndb:
  # The clones the worker writes and the scanner reads. In memory: nothing scanned reaches a disk.
  scan-work:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=${GARNETOPS_WORK_TMPFS:-4g},uid=1000,gid=1000,mode=0700
  # The scanner's Unix socket, the only way to talk to it.
  scanner-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=1000,gid=1000,mode=0700
  web-data:
  web-config:
  updater-state:
  updater-shared:
  updater-verify:

networks:
  # Service to service only; no route to the outside.
  internal:
    internal: true
  # The published ports of the web edge.
  public:
  # Outbound for the worker (clones, vulnerability data) and the updater (release feed, registry).
  egress:
