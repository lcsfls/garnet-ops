packages:
  - "apps/*"
  - "packages/*"

# Dependencies may only run install scripts when listed here (supply-chain hardening).
allowBuilds:
  # The development PostgreSQL's binaries, one package per platform (dev only, never in the
  # images' runtime stage). Every platform must be listed, otherwise pnpm stops the install
  # there (the arm64 release build did).
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  esbuild: true
  # Optional native speed-ups of the ssh2 test server (dev only); the pure JS fallback is enough.
  cpu-features: false
  ssh2: false

# Do not install package versions younger than one day (minutes). Compromised
# releases are usually caught within hours. No silent exclusions: an exception
# needs a comment with the reason.
minimumReleaseAge: 1440

# drizzle-kit 0.31 (latest stable) still pulls the deprecated @esbuild-kit loader, which pins
# esbuild 0.18.20 (GHSA-67mh-4wv8-2f99, fixed in 0.25.0). Only that path is overridden; drop
# this when drizzle-kit no longer depends on @esbuild-kit.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
